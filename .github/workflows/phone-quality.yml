name: Phone quality
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  phone:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit regressions
        run: node --test tests/*.test.cjs
      - name: Install browser test dependency
        run: npm install --no-save --package-lock=false playwright@1.62.1
      - name: Install Chromium
        id: browser-install
        run: npx playwright install --with-deps chromium
      - name: Run every Chromium browser regression
        env:
          DOCK_TEST_OUTPUT: phone-test-output
        if: ${{ !cancelled() && steps.browser-install.outcome == 'success' }}
        run: node tools/run-browser-tests.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phone-quality-results
          path: phone-test-output
          retention-days: 7
